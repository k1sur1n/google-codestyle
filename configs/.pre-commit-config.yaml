  # ---------------------------------------------------------------------------
  # Дополнительные языки - раскомментируйте нужное (docs/languages/other.md).
  # Пути к jar-файлам (tools/…) - заглушки. Не запускалось, кроме gofmt.
  # ---------------------------------------------------------------------------
  # Go: golangci-lint v2.14.0 (не Google); language: golang - сборка из исходников.
